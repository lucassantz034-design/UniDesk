version: '3.8'

# ==============================================================================
# UNIDESK — HELPDESK UNIVERSITÁRIO INTELIGENTE
# Stack de Produção Zero-Friction para TI do Cliente (On-Premise / Docker)
# Comando para rodar: docker compose up -d
# ==============================================================================

services:
  # 1. Aplicação Principal UniDesk
  unidesk_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: unidesk:latest
    container_name: unidesk_core
    restart: always
    ports:
      - "${HOST_PORT:-80}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LICENSE_KEY=${LICENSE_KEY:-UD-PROD-DEMO-TRIAL}
      - CENTRAL_API_URL=${CENTRAL_API_URL:-http://localhost:4000}
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      # Persistência dos dados (banco SQLite, configurações e uploads)
      - ./data:/app/data
      # Pasta onde os backups automáticos diários são armazenados
      - ./backups:/app/backups
    networks:
      - unidesk_network

  # 2. Agente Automático de Backup do SQLite
  unidesk_backup:
    image: alpine:3.20
    container_name: unidesk_backup_cron
    restart: always
    depends_on:
      - unidesk_app
    volumes:
      - ./data:/app/data:ro
      - ./backups:/app/backups
      - ./scripts/backup.sh:/app/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache sqlite bash tzdata
        chmod +x /app/backup.sh
        echo "0 2 * * * /app/backup.sh >> /app/backups/backup.log 2>&1" > /etc/crontabs/root
        echo "[Backup Daemon] Rotina de backup automático agendada para 02:00 todos os dias."
        # Executa um primeiro backup de segurança na inicialização
        /app/backup.sh
        crond -f -l 2
    networks:
      - unidesk_network

networks:
  unidesk_network:
    driver: bridge

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniDesk — Helpdesk Universitário Inteligente</title>
    <link rel="icon" type="image/png" href="/assets/LOGO_UD.png" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('unidesk_theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-DeZnmMpF.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BRmKmlcb.css">
